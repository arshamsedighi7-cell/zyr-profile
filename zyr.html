<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYR | Gaming Profile</title>
<meta name="description" content="پروفایل گیمینگ رسمی ZYR">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%2300ffc8%22>Z</text></svg>">

<style>
  :root{
    --bg1:#050607;
    --bg2:#0a0d0f;
    --accent:#00ffc8;
    --accent2:#7b5cff;
    --accent3:#ff2e9a;
    --glass:rgba(255,255,255,0.05);
    --glass-border:rgba(255,255,255,0.12);
    --text:#f2f2f2;
    --muted:#9aa0a6;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050607;
    color:var(--text);
    font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  /* ===== animated background ===== */
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-glow span{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    mix-blend-mode:screen;
  }
  .bg-glow span:nth-child(1){
    width:340px; height:340px;
    background:var(--accent);
    top:-100px; left:-80px;
    animation:driftA 14s ease-in-out infinite;
  }
  .bg-glow span:nth-child(2){
    width:380px; height:380px;
    background:var(--accent2);
    bottom:-140px; right:-100px;
    animation:driftB 16s ease-in-out infinite;
  }
  .bg-glow span:nth-child(3){
    width:260px; height:260px;
    background:var(--accent3);
    top:40%; left:60%;
    animation:driftC 18s ease-in-out infinite;
    opacity:0.18;
  }
  @keyframes driftA{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(60px,80px) scale(1.15); }
  }
  @keyframes driftB{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-70px) scale(1.2); }
  }
  @keyframes driftC{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-40px,40px) scale(1.25); }
  }

  .grid-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse at center, black, transparent 75%);
    mask-image:radial-gradient(ellipse at center, black, transparent 75%);
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px 24px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    padding:30px 22px 24px;
    position:relative;
    overflow:hidden;
    animation:floatIn 0.8s cubic-bezier(.2,.8,.2,1) both;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:28px;
    padding:1px;
    background:linear-gradient(135deg, rgba(0,255,200,0.5), transparent 30%, transparent 70%, rgba(123,92,255,0.5));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0.6;
    animation:borderSpin 6s linear infinite;
    pointer-events:none;
  }

  @keyframes borderSpin{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
  }

  @keyframes floatIn{
    from{opacity:0; transform:translateY(24px) scale(0.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:22px;
    position:relative;
  }

  .avatar-wrap{
    position:relative;
    width:100px;
    height:100px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .avatar-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid transparent;
    border-top-color:var(--accent);
    border-right-color:var(--accent2);
    animation:spin 3.5s linear infinite;
  }
  .avatar-ring.reverse{
    inset:8px;
    border:1px solid transparent;
    border-bottom-color:var(--accent3);
    border-left-color:var(--accent);
    animation:spin 4.5s linear infinite reverse;
    opacity:0.7;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .avatar{
    width:76px;
    height:76px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 30% 30%, #1a1d1f, #08090a 70%);
    border:1.5px solid rgba(0,255,200,0.35);
    box-shadow:
      0 0 18px rgba(0,255,200,0.35),
      0 0 40px rgba(123,92,255,0.15),
      inset 0 0 12px rgba(0,255,200,0.08);
    position:relative;
    z-index:1;
    animation:pulseGlow 3.2s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 18px rgba(0,255,200,0.28), 0 0 40px rgba(123,92,255,0.12), inset 0 0 12px rgba(0,255,200,0.06);}
    50%{ box-shadow:0 0 30px rgba(0,255,200,0.55), 0 0 60px rgba(123,92,255,0.28), inset 0 0 16px rgba(0,255,200,0.12);}
  }

  .avatar span{
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-family:'Segoe UI',Arial,sans-serif;
  }

  .logo{
    font-size:40px;
    font-weight:800;
    letter-spacing:4px;
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(120deg,#ffffff 20%, var(--accent) 45%, var(--accent2) 65%, #ffffff 90%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
    animation:shineText 4s linear infinite, popIn .6s ease .1s both;
  }

  @keyframes shineText{
    to{ background-position:250% center; }
  }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(10px) scale(0.9); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .subtitle{
    color:var(--muted);
    font-size:14.5px;
    margin-top:6px;
    letter-spacing:0.3px;
    animation:popIn .6s ease .2s both;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    margin:6px 0 18px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    z-index:1;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border-radius:16px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.09);
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    position:relative;
    overflow:hidden;
    transition:transform .18s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    cursor:pointer;
    opacity:0;
    transform:translateY(14px);
    animation:btnIn .55s ease forwards;
  }

  .links .btn:nth-child(1){ animation-delay:.15s; }
  .links .btn:nth-child(2){ animation-delay:.22s; }
  .links .btn:nth-child(3){ animation-delay:.29s; }
  .links .btn:nth-child(4){ animation-delay:.36s; }
  .links .btn:nth-child(5){ animation-delay:.43s; }
  .links .btn:nth-child(6){ animation-delay:.50s; }

  @keyframes btnIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .btn::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left:-60%;
    width:40%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.14), transparent);
    transform:skewX(-20deg);
    transition:left .6s ease;
  }
  .btn:hover::after{ left:130%; }

  .btn:active{
    transform:scale(0.96);
  }

  .btn:hover{
    background:rgba(255,255,255,0.07);
    border-color:rgba(0,255,200,0.4);
    box-shadow:0 0 22px rgba(0,255,200,0.18);
    transform:translateY(-2px);
  }

  .btn .icon{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .btn:hover .icon{
    transform:scale(1.1) rotate(-4deg);
  }

  .btn .icon svg{ width:20px; height:20px; }

  .btn .meta{
    display:flex;
    flex-direction:column;
    line-height:1.3;
    overflow:hidden;
  }

  .btn .name{
    font-size:14px;
    font-weight:700;
    color:#fff;
  }

  .btn .user{
    font-size:12.5px;
    color:var(--muted);
    direction:ltr;
    text-align:right;
    unicode-bidi:plaintext;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .btn .arrow{
    margin-inline-start:auto;
    color:var(--muted);
    font-size:16px;
    transition:transform .2s ease, color .2s ease;
  }
  .btn:hover .arrow{ transform:translateX(-4px); color:var(--accent); }

  .btn.call{
    background:linear-gradient(135deg, rgba(0,255,200,0.14), rgba(123,92,255,0.10));
    border-color:rgba(0,255,200,0.35);
  }
  .btn.call:hover{
    box-shadow:0 0 28px rgba(0,255,200,0.3);
  }
  .btn.call .icon{ background:rgba(0,255,200,0.12); border-color:rgba(0,255,200,0.3); }

  /* platform accent colors on icon */
  .ic-telegram svg{ fill:#29b6f6; }
  .ic-rubika svg{ fill:#ff5722; }
  .ic-instagram svg{ fill:#e1306c; }
  .ic-discord svg{ fill:#5865f2; }
  .ic-x svg{ fill:#ffffff; }
  .ic-call svg{ fill:#00ffc8; }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(20,22,24,0.95);
    border:1px solid rgba(0,255,200,0.35);
    color:#fff;
    padding:10px 18px;
    border-radius:12px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
    z-index:50;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    margin-top:24px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:1px;
    position:relative;
    z-index:1;
    opacity:0;
    animation:popIn .6s ease .6s forwards;
  }

  footer .dot{
    color:var(--accent);
    margin:0 4px;
  }

  @media (max-width:360px){
    .logo{ font-size:34px; }
    .btn{ padding:12px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>

<script>
  // Discord: no public username-based profile URL exists, so copy the username instead.
  document.getElementById('discordBtn').addEventListener('click', function(){
    var username = this.getAttribute('data-username');
    var toast = document.getElementById('toast');

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(username).then(function(){
        showToast('یوزرنیم دیسکورد کپی شد: ' + username);
      }).catch(function(){
        showToast('یوزرنیم دیسکورد: ' + username);
      });
    } else {
      showToast('یوزرنیم دیسکورد: ' + username);
    }
  });
</script>
